  <style>
    :root {
      --emeraude: #1fb08f;
      --lagon: #8fe6cb;
      --sapin: #2f6b4c;
      --ciel: #6db8f2;
      --profond: #0b2e24;
      --texte: #ffffff;
      --texte-doux: rgba(255, 255, 255, .78);
      --verre: rgba(12, 46, 38, .32);
      --bord: rgba(255, 255, 255, .28);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--texte);
      background-color: #3d8a74;
      background-image: url("/images/lac.jpg");
      background-image: image-set(url("/images/lac.webp") type("image/webp"), url("/images/lac.jpg") type("image/jpeg"));
      background-size: max(100vw, 180vh) auto;
      background-position: 60% 100%;
      background-attachment: fixed;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 16px;
    }
    /* Voile léger pour la lisibilité, plus marqué en bas (lac) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 40, 70, .10) 0%, rgba(10, 40, 40, .05) 45%, rgba(6, 40, 32, .35) 100%);
      pointer-events: none;
    }
    main {
      position: relative;
      width: min(100%, 440px);
      padding: 46px 32px 34px;
      text-align: center;
      border-radius: 28px;
      background: var(--verre);
      border: 1px solid var(--bord);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 24px 60px rgba(4, 30, 24, .35), inset 0 1px 0 rgba(255, 255, 255, .25);
    }
    .avatar {
      display: block;
      width: 144px;
      height: 144px;
      margin: 0 auto 22px;
      padding: 4px;
      border-radius: 50%;
      background: conic-gradient(from 200deg, var(--lagon), var(--emeraude), var(--sapin), var(--ciel), var(--lagon));
    }
    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(11, 46, 36, .6);
    }
    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: .01em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .25);
    }
    .lieu {
      margin: 9px 0 0;
      font-size: 1.05rem;
      color: var(--texte-doux);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lieu::before {
      content: "";
      display: block;
      width: 46px;
      height: 2px;
      margin: 0 auto 14px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--lagon), var(--ciel));
    }
    ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 32px 0 0;
      padding: 0;
    }
    a {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      color: var(--texte);
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .25);
      transition: transform .2s ease, background-color .2s ease, color .2s ease, border-color .2s ease;
    }
    a:hover, a:focus-visible {
      transform: translateY(-3px);
      background: var(--lagon);
      border-color: var(--lagon);
      color: var(--profond);
    }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    svg { width: 25px; height: 25px; }
    @media (max-width: 400px) {
      main { padding: 38px 22px 30px; }
      .avatar { width: 136px; height: 136px; }
      h1 { font-size: 2.05rem; }
      ul { gap: 12px; }
      a { width: 56px; height: 56px; }
    }
    /* Carte centrée : la photo (4:3) fait au moins 135 % (140 % en portrait) de la hauteur d'écran et est calée en bas,
       le sommet se retrouve ainsi au-dessus de la carte quel que soit l'écran */
    @media (orientation: portrait) {
      body { background-size: auto 140%; }
    }
    @media (hover: none) { body { background-attachment: scroll; } }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
  </style>
</head>
